spring.application.name=mdd-api
server.port=9000

# Local secrets (git-ignored), see .env.example
spring.config.import=optional:file:.env[.properties]

# Database (local MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mdd?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema created by Hibernate from the entities, then seeded by data.sql (topics).
# MVP choice: the schema is dropped and recreated on every startup.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (secret: Base64 key of at least 32 bytes; expiration: 7 days by default)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/api/swagger
springdoc.api-docs.path=/api/openapi
