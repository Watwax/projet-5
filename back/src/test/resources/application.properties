# Test configuration: in-memory H2 in MySQL mode, no local MySQL or .env needed.
spring.datasource.url=jdbc:h2:mem:mdd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# Test-only JWT key (not a real secret)
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1tZGQtYXBpLTEyMzQ1Njc4OTA=
app.jwt.expiration-ms=3600000

springdoc.swagger-ui.path=/api/swagger
springdoc.api-docs.path=/api/openapi
